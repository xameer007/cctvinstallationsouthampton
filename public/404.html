<style>

    --cream: #faf8f4; --ink: #1a1612; --muted: #7a6f62;
    --accent: #c84b2f; --border: #ddd7cc; --paper: #f5f2ec;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--cream);
    font-family: 'Instrument Sans', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }
  .logo {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 1.4rem;
    margin-bottom: 3rem;
    letter-spacing: -0.03em;
  }
  .logo em { font-style: italic; color: var(--accent); }
  .error-num {
    font-family: 'Fraunces', serif;
    font-size: clamp(6rem, 20vw, 10rem);
    font-weight: 800;
    line-height: 1;
    color: var(--paper);
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 1rem 2.5rem;
    margin-bottom: 2rem;
    letter-spacing: -0.05em;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 800;
    margin-bottom: 1rem;
    letter-spacing: -0.02em;
  }
  h1 em { font-style: italic; color: var(--accent); }
  p { font-size: 1rem; color: var(--muted); max-width: 420px; line-height: 1.7; margin-bottom: 2.5rem; }
  .actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
  .btn-primary {
    background: var(--accent); color: #fff;
    padding: 0.85rem 1.8rem; border-radius: 5px;
    font-weight: 700; font-size: 0.9rem;
    text-decoration: none;
    box-shadow: 0 4px 16px rgba(200,75,47,0.25);
    transition: all 0.2s;
  }
  .btn-primary:hover { background: #a83a20; transform: translateY(-2px); }
  .btn-secondary {
    background: #fff; color: var(--ink);
    padding: 0.85rem 1.8rem; border-radius: 5px;
    font-weight: 600; font-size: 0.9rem;
    text-decoration: none; border: 1px solid var(--border);
    transition: all 0.2s;
  }
  .btn-secondary:hover { border-color: var(--ink); }
  .footer-note {
    margin-top: 3rem;
    font-size: 0.8rem;
